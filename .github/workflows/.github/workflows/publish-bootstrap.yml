name: Publish verified beta bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get exact public repository revision
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" stage
          cd stage
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and assemble signed beta
        run: |
          cd stage
          python3 *assemble-bootstrap.py
      - name: Publish testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stage
          gh release create v1.3.21 release/one-world-beta-1.3.21.apk release/beta-update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "One World Beta 1.3.21 - updater bootstrap" --notes "Updater bootstrap WITHOUT new background music. Original game by Smiley, modified with permission. Install over the existing beta; do not uninstall or clear data. Same beta package and signing certificate. Android update/download/install behavior is not yet phone-verified. Keep asset license notices. Stable launch is not part of this prerelease."
