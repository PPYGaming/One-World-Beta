name: Publish verified beta 1.3.23
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get exact public repository revision
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" stage
          cd stage
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify and assemble signed beta
        run: |
          cd stage
          python3 *assemble-followon1323.py
      - name: Publish testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stage
          gh release create v1.3.23 release/one-world-beta-1.3.23.apk release/beta-update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "One World Beta 1.3.23 - startup loading update UI" --notes "Testing beta, not stable. Update check now starts on the first loading screen before lobby, character or world. Minimal game-themed controls replace native update dialogs; Android permission/settings and package installer remain system screens. Keeps beta 1.3.22 graphics, crafting and pregame music changes. Browser/package checks do NOT prove phone graphics, playback, performance or update/download/install behavior. Install over the existing beta; do not uninstall or clear data. Same beta package/signing certificate, Android 10-16 static compatibility only. Original game by Smiley, modified with permission; retain bundled notices. Stable launch is not part of this prerelease."
